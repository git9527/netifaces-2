name: CI

on:
  workflow_dispatch:

jobs:

  macos:
    name: Build MacOS wheels
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - uses: messense/maturin-action@v1
      with:
        command: build
        args: --release -o dist
    - uses: actions/setup-python@v5
      with:
        python-version: |
          3.13
    - name: Test wheels
      run: |
        pip install nox
        nox
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels
        path: dist
